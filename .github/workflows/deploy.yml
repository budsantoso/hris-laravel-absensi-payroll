name: Deploy to cPanel

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣  Checkout kode repo
    - name: Checkout code
      uses: actions/checkout@v3

    # 2️⃣  Install dependensi Laravel
    - name: Install PHP dependencies
      run: |
        composer install --no-dev --optimize-autoloader --no-interaction

    # 3️⃣  Generate key & cache config
    - name: Laravel setup
      run: |
        cp .env.example .env
        php artisan key:generate
        php artisan config:cache
        php artisan route:cache
        php artisan view:cache

    # 4️⃣  Deploy ke cPanel lewat FTP/SFTP
    - name: Deploy via FTP
      uses: SamKirkland/FTP-Deploy-Action@master
      with:
        server: ${{ secrets.CP_HOST }}
        username: ${{ secrets.CP_USERNAME }}
        password: ${{ secrets.CP_PASSWORD }}
        source: . # upload seluruh project Laravel
        target: /home/swit1503/public_html/hris.switchcode.id
        delete: true
        exclude: |
          .git*
          .github*
          node_modules
          vendor
          storage/logs/*
          storage/framework/cache/*
          storage/framework/sessions/*
          storage/framework/views/*
          .env
          .env.*
          *.log
          phpunit.xml
          README.md